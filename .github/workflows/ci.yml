name: Attuner verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: npm install --global pnpm@10.33.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:connected
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: attuner-connected-ui
          path: artifacts/phase-3/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - run: npm install --global pnpm@10.33.4
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @attuner/desktop build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm --filter @attuner/desktop tauri build --debug --no-bundle
      - name: Package standalone Windows qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-qualification.ps1
      - name: Verify standalone Windows qualification bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $attunerBundle = Get-ChildItem artifacts -Directory -Filter 'windows-qualification-*' | Select-Object -First 1
          & (Join-Path $attunerBundle.FullName 'Qualify-Windows.ps1') -AllowServer
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: attuner-windows-qualification
          path: artifacts/windows-qualification-*/
          retention-days: 14
