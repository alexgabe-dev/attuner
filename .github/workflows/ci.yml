name: Attuner verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  web-and-api:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
      - run: npm install --global pnpm@10.33.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Qualify actual systemd credential ACL delivery
        run: pnpm exec tsx scripts/check-systemd-credentials.ts
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:connected
        env:
          ATTUNER_QUALIFICATION_PHASE: '4'
      - run: pnpm test:staging -- --docker
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: attuner-connected-ui
          path: |
            artifacts/phase-4/web-*.png
            artifacts/phase-4/web-qualification.json
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: attuner-phase-4-qualification
          path: artifacts/phase-4/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.2
      - run: npm install --global pnpm@10.33.4
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @attuner/desktop build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: pnpm --filter @attuner/desktop tauri build --debug --no-bundle
      - name: Package standalone Windows qualification
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows-qualification.ps1
      - name: Verify standalone Windows qualification bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $attunerBundle = Get-ChildItem artifacts -Directory -Filter 'windows-qualification-*' | Select-Object -First 1
          $attunerOutput = & (Join-Path $attunerBundle.FullName 'Qualify-Windows.exe') --allow-server
          $attunerOutput | Write-Output
          if ($LASTEXITCODE -ne 0) { throw 'Native standalone qualification failed.' }
          $attunerResult = @($attunerOutput | Where-Object { $_ -match '^Results: ' })
          if ($attunerResult.Count -ne 1) { throw 'Expected one native results directory.' }
          $attunerResultPath = $attunerResult[0].Substring(9)
          $attunerResultName = [IO.Path]::GetFileName($attunerResultPath)
          if ($attunerResultName -notmatch '^attuner-windows-results-[a-zA-Z0-9]+$') { throw 'Unexpected native results name.' }
          # Rust may print the 8.3 spelling of TEMP; enumerate the trusted TEMP
          # parent instead of weakening containment or comparing path spellings.
          $attunerResultDirectory = @(Get-ChildItem -LiteralPath ([IO.Path]::GetTempPath()) -Directory -Filter $attunerResultName)
          if ($attunerResultDirectory.Count -ne 1 -or $attunerResultDirectory[0].Name -cne $attunerResultName) { throw 'Results are not in the expected temporary parent.' }
          if ($attunerResultDirectory[0].Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'Unsafe results directory.' }
          Copy-Item -LiteralPath $attunerResultDirectory[0].FullName -Destination (Join-Path $attunerBundle.FullName 'results') -Recurse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: runner.os == 'Windows'
        with:
          name: attuner-windows-qualification
          path: artifacts/windows-qualification-*/
          retention-days: 14
